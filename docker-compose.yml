services:
  # Backend (NestJS API)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nightout-backend
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost,http://admin.localhost
      # Supabase local รันด้วย `pnpm db:start` (supabase CLI) บนเครื่องนี้ — container ออกผ่าน host gateway
      SUPABASE_URL: ${DOCKER_SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4dWVhdnF5eWtkaXBjanFieHlkIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTcwMDAwMDAwMCwiZXhwIjoxODAwMDAwMDAwfQ.REDACTED}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      JOB_SECRET: ${JOB_SECRET:-change-me-in-production}
      QR_SIGNING_KEY: ${QR_SIGNING_KEY:-change-me-in-production}
      PAYOUT_ENCRYPTION_KEY: ${PAYOUT_ENCRYPTION_KEY:-change-me-at-least-16-chars}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nightout
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend (React)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nightout-frontend
    ports:
      - "5173:80"
    environment:
      # ค่าถูก "อบ" ตอน build (Vite) — ต้อง rebuild image เมื่อค่าเปลี่ยน
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001/api}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://127.0.0.1:54321}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
      VITE_MAP_TILE_URL_LIGHT: ${VITE_MAP_TILE_URL_LIGHT:-}
      VITE_MAP_TILE_URL_DARK: ${VITE_MAP_TILE_URL_DARK:-}
      VITE_MAP_TILE_ATTRIBUTION: ${VITE_MAP_TILE_ATTRIBUTION:-}
    depends_on:
      - backend
    networks:
      - nightout
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Admin (React)
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: nightout-admin
    ports:
      - "5174:80"
    environment:
      # ค่าถูก "อบ" ตอน build (Vite) — ต้อง rebuild image เมื่อค่าเปลี่ยน
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001/api}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://127.0.0.1:54321}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    depends_on:
      - backend
    networks:
      - nightout
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/admin/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  nightout:
    driver: bridge
