# Supabase local config — https://supabase.com/docs/guides/local-development/cli/config
project_id = "nightout"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[local_smtp]
# ดูอีเมลทดสอบ (ยืนยันอีเมล / รีเซ็ตรหัส) ที่ http://127.0.0.1:54324
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://localhost:5174/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
# เข้าสู่ระบบด้วย email + password เท่านั้น
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.sms]
enable_signup = false

[auth.mfa.totp]
# Admin ต้องใช้ TOTP MFA
enroll_enabled = true
verify_enabled = true

# [auth.captcha]
# enabled = true
# provider = "turnstile"
# secret = "env(TURNSTILE_SECRET_KEY)"

[analytics]
enabled = false
