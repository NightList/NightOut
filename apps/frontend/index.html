<!doctype html>
<html lang="th" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07070D" />
  <meta name="description"
    content="NightOut — จัดอันดับร้านกลางคืน ดูราคา ความปลอดภัย และจองโต๊ะ" />
  <link rel="icon" href="/images/common/logo.png"
    type="image/svg+xml" />
  <link rel="preconnect"
    href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com"
    crossorigin />
  <!-- ฟอนต์โหลดแบบไม่บล็อกการวาดหน้า (แสดงฟอนต์ระบบก่อน แล้วสลับเมื่อโหลดเสร็จ) -->
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet" media="print"
    onload="this.media='all'" />
  <!-- รูปพื้นหลัง Hero ให้เริ่มโหลดทันที (LCP) -->
  <link rel="preload" as="image" type="image/webp"
    href="/images/home/hero-poster.webp"
    imagesrcset="/images/home/hero-poster-sm.webp 854w, /images/home/hero-poster.webp 1600w"
    imagesizes="100vw"
    fetchpriority="high" />
  <title>NightOut</title>
  <style>
    .boot{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;background:#07070d}
    html.light .boot{background:#faf8f3}
    .boot img{width:64px;height:auto;animation:boot-pulse 1.6s ease-in-out infinite}
    .boot__bar{width:120px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#e8b64c,transparent) 0 0/50% 100% no-repeat,rgba(232,182,76,.18);animation:boot-slide 1.1s linear infinite}
    @keyframes boot-pulse{50%{opacity:.6}}
    @keyframes boot-slide{from{background-position:-100% 0,0 0}to{background-position:200% 0,0 0}}
    @media (prefers-reduced-motion:reduce){.boot img,.boot__bar{animation:none}}
  </style>
  <!-- กันจอกะพริบ: ตั้งธีมก่อน React render (key ต้องตรงกับ THEME_STORAGE_KEY) -->
  <script>
    (function () {
      try {
        var m = localStorage.getItem('nightout-theme') || 'DARK';
        var dark =
          m === 'DARK' ||
          (m === 'SYSTEM' && (!window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches));
        var t = dark ? 'dark' : 'light';
        document.documentElement.className = t;
        document.documentElement.style.colorScheme = t;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#07070D' : '#FAF8F3');
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <!-- หน้าโหลดระหว่างรอ JS/ข้อมูล (React แทนที่ทั้งก้อนตอน render) — ไม่ให้เห็นจอว่าง -->
  <div id="root">
    <div class="boot" role="status" aria-label="กำลังโหลด NightOut">
      <img src="/images/common/logo.png" alt="" width="64" height="62" />
      <span class="boot__bar"></span>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
