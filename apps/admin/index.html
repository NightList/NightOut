<!doctype html>
<html lang="th" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07070D" />
  <meta name="description" content="NightOut Backoffice" />
  <link rel="icon" href="/favicon.svg"
    type="image/svg+xml" />
  <link rel="preconnect"
    href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com"
    crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet" />
  <title>NightOut Admin</title>
  <!-- กันจอกะพริบ: ตั้งธีมก่อน React render (key ต้องตรงกับ THEME_STORAGE_KEY) -->
  <script>
    (function () {
      try {
        var m = localStorage.getItem('nightout-theme') || 'DARK';
        var dark =
          m === 'DARK' ||
          (m === 'SYSTEM' && (!window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches));
        var t = dark ? 'dark' : 'light';
        document.documentElement.className = t;
        document.documentElement.style.colorScheme = t;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#07070D' : '#FAF8F3');
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
